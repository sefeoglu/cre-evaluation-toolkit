[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "CREvaluator"
version = "2025.3.10"
dependencies = [
  "httpx",
  "gidgethub[httpx]>4.0.0",
  "django>2.1; os_name != 'nt'",
  "django>2.0; os_name == 'nt'",
]
requires-python = ">=3.8"
authors = [
  {name = "Sefika Efeoglu", email = "sefikaefeoglu@gmail.com"},
]
maintainers = [
  {name = "Sefika Efeoglu", email = "sefikaefeoglu@gmail.com""}
]
description = "A Continual Relation Extraction Evaluator"
readme = "README.md"
license = "MIT"
license-files = ["LICEN[CS]E.*"]
keywords = ["Task Incremental Learning", "Continual Learning", "Evaluation", "CRE"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Programming Language :: Python"
]

[project.optional-dependencies]
gui = ["PyQt5"]
cli = [
  "rich",
  "click",
]

[project.urls]
Repository = "https://github.com/sefeoglu/cre-evaluation-toolkit.git"

[project.scripts]
spam-cli = "spam:main_cli"

[project.gui-scripts]
spam-gui = "spam:main_gui"

[project.entry-points."spam.magical"]
tomatoes = "spam:main_tomatoes"